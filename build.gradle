plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.3.0'
}

allure {
    report {
        version.set("2.46.2")
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set("3.0.0") //версия интеграции фреймворка и Allure
            }
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation("com.codeborne:selenide:7.18.2",
            "org.junit.jupiter:junit-jupiter:6.1.3",
            'org.seleniumhq.selenium:selenium-java:4.50.0',
            'org.assertj:assertj-core:4.0.0-M1',
            "com.codeborne:pdf-test:2.1.1",
            "com.codeborne:xls-test:1.8.0",
            'org.apache.poi:poi-ooxml:5.2.3',
            'org.slf4j:slf4j-simple:2.0.9',
            "com.opencsv:opencsv:5.12.0",
            "com.github.javafaker:javafaker:1.0.2",
            'io.qameta.allure:allure-selenide:3.1.1')


    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"

    implementation 'org.slf4j:slf4j-simple:2.0.9'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}